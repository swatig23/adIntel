<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdIntel — Competitor Ad Copilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .gradient-text {
      background: linear-gradient(90deg, #6366f1 0%, #ec4899 50%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .htmx-request .spinner { display: inline-block; }
    .spinner { display: none; }
    .htmx-request .btn-text { opacity: 0.4; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

<div class="max-w-5xl mx-auto px-6 py-10">

  <!-- Header -->
  <header class="mb-10">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-indigo-500 via-pink-500 to-amber-500 flex items-center justify-center text-white font-bold text-lg">A</div>
      <h1 class="text-3xl font-bold text-slate-900">AdIntel</h1>
      {% if using_stub %}
      <span class="ml-auto text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-800 font-medium">
         DEMO MODE — using stubbed Meta data
      </span>
      {% endif %}
    </div>
    <p class="text-lg text-slate-600 max-w-2xl">
      Competitor ad-library copilot. Learn from your competitors' <span class="gradient-text font-semibold">proven winners</span>,
      then generate fresh creatives that mimic what works.
    </p>
  </header>

  <!-- Form -->
  <form
    hx-post="/analyze"
    hx-target="#report"
    hx-swap="innerHTML"
    hx-indicator="#spinner-container"
    class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8"
  >
    <div class="grid grid-cols-1 gap-6">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Your Brand</label>
        <input
          name="user_brand"
          required
          placeholder="e.g., Warby Parker"
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Competitors <span class="text-slate-400">(comma-separated, up to 10)</span>
        </label>
        <input
          name="competitors"
          required
          placeholder="Ray-Ban, Zenni Optical, GlassesUSA"
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">
          Industry hint <span class="text-slate-400">(optional)</span>
        </label>
        <input
          name="industry_hint"
          placeholder="e.g., DTC eyewear"
          class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition"
        />
      </div>

      <label class="flex items-center gap-3 cursor-pointer">
        <input type="checkbox" name="generate_creatives" checked class="w-5 h-5 rounded text-indigo-600 focus:ring-indigo-500" />
        <span class="text-sm text-slate-700">Generate 3 fresh ad creatives with Nano Banana</span>
      </label>

      <button
        type="submit"
        class="w-full py-4 rounded-lg bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-700 hover:to-pink-700 text-white font-semibold text-lg transition shadow-lg shadow-indigo-500/20"
      >
        <span class="btn-text"> Analyze competitors</span>
        <span id="spinner-container" class="spinner">
          <svg class="inline animate-spin w-5 h-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Analyzing (30–60s)…
        </span>
      </button>
    </div>
  </form>

  <!-- Report target -->
  <div id="report"></div>

  <!-- Footer -->
  <footer class="mt-12 text-center text-sm text-slate-400">
    Built with Google ADK · Gemini 2.5 · Nano Banana · Firebase · Cloud Run
  </footer>

</div>

</body>
</html>
