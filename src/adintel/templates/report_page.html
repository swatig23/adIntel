<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AdIntel Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf7f0; --ink:#1c1a17; --ink-soft:#57534a; --violet:#7a2e2e; --fuchsia:#b5533c; --amber:#b8860b; }
    body { font-family:'Source Sans 3',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    .display { font-family:'Playfair Display',Georgia,serif; }
    .card { background:#fff; border-radius:0.75rem; border:1px solid #e4ddc9; }
    .card-shadow { box-shadow: 0 2px 12px rgba(28,26,23,0.05); }
  </style>
</head>
<body class="min-h-screen">
<div class="max-w-5xl mx-auto px-6 md:px-10 py-10">
  <div class="flex items-center justify-between mb-8">
    <h1 class="display text-2xl font-extrabold">AdIntel Report</h1>
    <div class="flex gap-5 text-sm font-semibold">
      <a href="/history" class="text-[var(--ink-soft)] hover:text-[var(--violet)]">History</a>
      <a href="/" class="text-[var(--ink-soft)] hover:text-[var(--violet)]">New Analysis</a>
    </div>
  </div>
  {% include "report.html" %}
</div>
</body>
</html>
