<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AdIntel Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f5f3ff; --ink:#1e1b2e; --ink-soft:#6b6580; --violet:#7c3aed; --fuchsia:#d946ef; --amber:#f59e0b; }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    .display { font-family:'Sora',system-ui,sans-serif; }
    .card { background:#fff; border-radius:1.25rem; }
    .card-shadow { box-shadow: 0 4px 24px rgba(124,58,237,0.08); }
  </style>
</head>
<body class="min-h-screen">
<div class="max-w-5xl mx-auto px-6 md:px-10 py-10">
  <div class="flex items-center justify-between mb-8">
    <h1 class="display text-2xl font-extrabold">AdIntel Report</h1>
    <div class="flex gap-5 text-sm font-semibold">
      <a href="/history" class="text-[var(--ink-soft)] hover:text-[var(--violet)]">History</a>
      <a href="/" class="text-[var(--ink-soft)] hover:text-[var(--violet)]">New Analysis</a>
    </div>
  </div>
  {% include "report.html" %}
</div>
</body>
</html>
