<!DOCTYPE html>
<html>
<head>
  <title>AdIntel &middot; Error</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Source Sans 3',system-ui,sans-serif; background:#faf7f0; color:#1c1a17; }
    .display { font-family:'Playfair Display',Georgia,serif; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-2xl border border-[#e4ddc9] shadow-sm p-8 text-center">
    <div class="mx-auto mb-4 w-14 h-14 rounded-full bg-[#f1e4e0] flex items-center justify-center">
      <svg class="w-7 h-7 text-[#7a2e2e]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
    </div>
    <h1 class="display text-xl font-bold mb-2 text-[#7a2e2e]">{{ title | default("Something went wrong") }}</h1>
    <p class="text-sm text-[var(--ink-soft, #5c554a)] leading-relaxed mb-6">
      {{ message | default("We couldn't finish this analysis. Please try again.") }}
    </p>
    <a href="/" class="inline-block px-5 py-2.5 rounded-lg bg-[#7a2e2e] text-white font-semibold text-sm hover:bg-[#652525] transition-colors">
      &larr; Back to AdIntel
    </a>
  </div>
</body>
</html>
