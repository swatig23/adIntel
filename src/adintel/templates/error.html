<!DOCTYPE html>
<html>
<head>
  <title>Error</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Source Sans 3', system-ui, sans-serif; background: #faf7f0; color: #1c1a17; }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
  </style>
</head>
<body class="p-10">
  <div class="max-w-2xl mx-auto">
    <h1 class="font-serif text-2xl font-bold mb-4 flex items-center gap-2 text-[#7a2e2e]">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      Pipeline Error
    </h1>
    <pre class="text-sm bg-[#f1e4e0] border border-[#e4ddc9] p-4 rounded overflow-auto text-[#1c1a17]">{{ error }}</pre>
    <a href="/" class="mt-4 inline-block text-[#7a2e2e] hover:underline">&larr; Back</a>
  </div>
</body>
</html>
