<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AdIntel - History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf7f0; --ink:#1c1a17; --ink-soft:#57534a; --violet:#7a2e2e; }
    body { font-family:'Source Sans 3',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    .display { font-family:'Playfair Display',Georgia,serif; }
    .card { background:#fff; border-radius:0.75rem; border:1px solid #e4ddc9; }
    .card-shadow { box-shadow: 0 2px 12px rgba(28,26,23,0.05); }
  </style>
</head>
<body class="min-h-screen">
<div class="max-w-4xl mx-auto px-6 md:px-10 py-10">
  <div class="flex items-center justify-between mb-8">
    <h1 class="display text-2xl font-extrabold">Analysis History</h1>
    <a href="/" class="text-sm font-semibold text-[var(--ink-soft)] hover:text-[var(--violet)]">New Analysis</a>
  </div>

  {% if not rows %}
    <div class="card card-shadow p-10 text-center text-[var(--ink-soft)]">
      No analyses yet. Run one from the <a href="/" class="text-[var(--violet)] font-semibold underline">home page</a>.
    </div>
  {% else %}
    <div class="space-y-3">
      {% for row in rows %}
      <a href="/report/{{ row.id }}" class="card card-shadow block p-5 hover:shadow-lg transition">
        <div class="flex items-center justify-between">
          <div>
            <div class="display font-bold">{{ row.brand }}</div>
            <div class="text-sm text-[var(--ink-soft)] mt-0.5">vs {{ row.competitors | join(", ") }}</div>
          </div>
          <div class="text-xs text-[var(--ink-soft)] whitespace-nowrap ml-4">{{ row.saved_at or "" }}</div>
        </div>
      </a>
      {% endfor %}
    </div>
  {% endif %}
</div>
</body>
</html>
