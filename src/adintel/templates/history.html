<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AdIntel - History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #faf7f0;
      --paper-line: #e4ddc9;
      --ink: #1c1a17;
      --ink-soft: #57534a;
      --accent: #7a2e2e;
    }
    body { font-family: 'Source Sans 3', system-ui, sans-serif; background: var(--paper); color: var(--ink); }
    .font-serif { font-family: 'Playfair Display', Georgia, serif; }
    .rule { border-top: 1px solid var(--paper-line); }
  </style>
</head>
<body class="min-h-screen">
<div class="max-w-2xl mx-auto px-6 py-14">
  <div class="flex items-center justify-between mb-10">
    <h1 class="font-serif text-3xl font-bold">Analysis History</h1>
    <a href="/" class="text-sm uppercase tracking-wider text-[var(--ink-soft)] hover:text-[var(--accent)]">New Analysis</a>
  </div>

  {% if not rows %}
    <div class="text-center text-[var(--ink-soft)] py-10 rule">
      No analyses yet. Run one from the <a href="/" class="text-[var(--accent)] underline">home page</a>.
    </div>
  {% else %}
    <div>
      {% for row in rows %}
      <a href="/report/{{ row.id }}" class="block rule py-4 hover:bg-[var(--paper-line)]/20 transition -mx-2 px-2">
        <div class="flex items-center justify-between">
          <div>
            <div class="font-serif font-semibold text-lg">{{ row.brand }}</div>
            <div class="text-sm text-[var(--ink-soft)] mt-0.5">vs {{ row.competitors | join(", ") }}</div>
          </div>
          <div class="text-xs text-[var(--ink-soft)] whitespace-nowrap ml-4">{{ row.saved_at or "" }}</div>
        </div>
      </a>
      {% endfor %}
    </div>
  {% endif %}
</div>
</body>
</html>
