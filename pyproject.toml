[project]
name = "adintel"
version = "0.1.0"
description = "AdIntel — Competitor ad-library copilot for SMBs. Agentic Gemini + Nano Banana."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    # Google AI / ADK
    "google-genai>=0.3.0",
    "google-adk>=0.1.0",
    # Config + HTTP
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    # Storage (optional in MVP; stubbed by default)
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.2",
    "google-cloud-bigquery>=3.25.0",
    # Utilities
    "pillow>=10.4.0",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adintel"]
